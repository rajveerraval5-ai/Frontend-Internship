
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">

        <div class="profile-image">
            <img src="raj.png.jpeg" alt="My Profile Photo">
        </div>

        <h1>Rajveer Raval</h1>

        <h3>Student | Frontend Developer</h3>

        <p class="bio">
            Hello! I am a passionate student learning
            web development. I love creating beautiful
            and responsive websites using HTML and CSS.
        </p>

        <div class="skills">
            <h2>My Skills</h2>

            <div class="skill-list">
                <span>HTML</span>
                <span>CSS</span>
                <span>JavaScript</span>
                <span>GitHub</span>
                <span>Responsive Design</span>
            </div>
        </div>

        <div class="social-links">
            <a href="https://github.com/rajveerraval5-ai"
               target="_blank">GitHub</a>

            <a href="https://www.linkedin.com/"
               target="_blank">LinkedIn</a>
        </div>

        <a href="mailto:your-email@example.com"
           class="contact-btn">Contact Me</a>

    </div>

</body>
</html>
